name: measureman-commerce

services:
  app:
    image: "${IMAGE_REPOSITORY}:${IMAGE_TAG}"
    container_name: "${CONTAINER_NAME}"
    # Some NAS ACLs do not allow changing bind-mount ownership. Run the app
    # as root inside the container so SQLite and runtime reports remain writable.
    user: "0:0"
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_APP_URL: "${PUBLIC_APP_URL}"
      DATABASE_URL: "${DATABASE_URL}"
      SECRET_KEY: "${SECRET_KEY}"
      AUTH_SESSION_TTL_DAYS: "${AUTH_SESSION_TTL_DAYS}"
      AUTH_SECURE_COOKIE: "${AUTH_SECURE_COOKIE}"
      GERPGO_APP_ID: "${GERPGO_APP_ID:-}"
      GERPGO_APP_KEY: "${GERPGO_APP_KEY:-}"
      GERPGO_BASE_URL: "${GERPGO_BASE_URL:-https://open.gerpgo.com/api/open}"
      GERPGO_SIGNING_ENABLED: "${GERPGO_SIGNING_ENABLED:-true}"
      GERPGO_TIMEOUT_MS: "${GERPGO_TIMEOUT_MS:-10000}"
      GERPGO_STORE_NAME: "${GERPGO_STORE_NAME:-MEASUREMAN}"
      DATABASE_MIGRATE_ON_START: "${DATABASE_MIGRATE_ON_START}"
      STORE_OPS_AUTOMATION_ROOT: /opt/store-ops
      STORE_OPS_DATA_ROOT: /data/sources
      STORE_OPS_RUNTIME_ROOT: /data/runtime
      STORE_OPS_STATE_DB: /data/runtime/db/operations.sqlite3
      STORE_OPS_PYTHON: /opt/store-ops-venv/bin/python
      API_KEY: "${API_KEY}"
      LLM_PROVIDER: "${LLM_PROVIDER}"
      LLM_API_KEY: "${LLM_API_KEY}"
    ports:
      - "${APP_PORT}:3000"
    volumes:
      - "${DATA_PATH}:/data/app"
      - "${RUNTIME_PATH}:/data/runtime"
      - "${SOURCE_DATA_PATH}:/data/sources:ro"
      - "${LOG_PATH}:/data/logs"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: "${CLOUDFLARE_IMAGE}"
    container_name: "${CLOUDFLARE_CONTAINER_NAME}"
    restart: unless-stopped
    init: true
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN}"
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
