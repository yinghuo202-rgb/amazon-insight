name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_commit:
        description: Verify an already-published immutable commit image without rebuilding
        type: string
        required: false
      restore_stable_latest:
        description: Restore latest from failed rc.1 to the previous verified v1.4.1
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify:
    if: ${{ !inputs.verify_commit }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: automation/integrations/amazon-insight/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install web dependencies
        working-directory: automation/integrations/amazon-insight
        run: pnpm install --frozen-lockfile

      - name: Validate NAS worker Compose overlay
        env:
          IMAGE_REPOSITORY: ghcr.io/yinghuo202-rgb/amazon-insight
          IMAGE_TAG: v1.5.0-rc.5
          CONTAINER_NAME: measureman-compose-check
          APP_PORT: "3001"
          PUBLIC_APP_URL: https://example.invalid
          DATABASE_URL: file:/data/app/selection.db
          SECRET_KEY: compose-validation-placeholder-not-a-secret
          RUNTIME_PATH: ./data/runtime
          SOURCE_DATA_PATH: ./data/sources
          CLOUDFLARE_IMAGE: cloudflare/cloudflared:latest
          CLOUDFLARE_CONTAINER_NAME: measureman-tunnel-check
        run: docker compose -f docker/nas/measureman-commerce-online-named-volume.yml -f docker/nas/measureman-data-worker.override.yml config --quiet

      - name: Verify web application
        working-directory: automation/integrations/amazon-insight
        run: |
          pnpm lint
          pnpm test:ci
          pnpm build
          pnpm exec tsc --noEmit

      - name: Verify store operations
        env:
          MEASUREMAN_TEST_NODE: node
          MEASUREMAN_TEST_COMPILED_WORKER: ${{ github.workspace }}/automation/integrations/amazon-insight/.next/standalone/worker/worker/data-worker.js
        run: |
          python -m pip install -e automation
          python -m unittest discover -s automation/tests -v

  docker:
    if: ${{ !inputs.verify_commit }}
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=long,prefix=

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image startup on both NAS architectures
        if: github.event_name != 'pull_request'
        env:
          SMOKE_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          bash docker/scripts/smoke-image.sh "$SMOKE_IMAGE" linux/amd64
          bash docker/scripts/smoke-image.sh "$SMOKE_IMAGE" linux/arm64
          docker buildx imagetools inspect "$SMOKE_IMAGE"
          echo 'Image startup, account persistence, write guards, database initialization and worker heartbeat passed on linux/amd64 and linux/arm64.' >> "$GITHUB_STEP_SUMMARY"

      - name: Promote verified default-branch image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker buildx imagetools create -t "$IMAGE_NAME:latest" "$IMAGE_NAME:${{ github.sha }}"

  published-image-check:
    if: ${{ inputs.verify_commit }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore accidentally promoted prerelease
        if: ${{ inputs.restore_stable_latest }}
        run: |
          current_digest="$(docker buildx imagetools inspect "$IMAGE_NAME:latest" | awk '/^Digest:/ {print $2; exit}')"
          stable_digest="$(docker buildx imagetools inspect "$IMAGE_NAME:v1.4.1" | awk '/^Digest:/ {print $2; exit}')"
          if [ "$current_digest" = 'sha256:4c7753c6c2c62ab4b0e4843d4bdb0875a940c96cf4ec52bc27b70b4e095ec06d' ]; then
            docker buildx imagetools create -t "$IMAGE_NAME:latest" "$IMAGE_NAME:v1.4.1"
          else
            test "$current_digest" = "$stable_digest"
          fi
          restored_digest="$(docker buildx imagetools inspect "$IMAGE_NAME:latest" | awk '/^Digest:/ {print $2; exit}')"
          test "$restored_digest" = "$stable_digest"
          echo 'latest restored to verified v1.4.1.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify immutable published image
        env:
          VERIFY_COMMIT: ${{ inputs.verify_commit }}
        run: |
          [[ "$VERIFY_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          bash docker/scripts/smoke-image.sh "$IMAGE_NAME:$VERIFY_COMMIT" linux/amd64
          bash docker/scripts/smoke-image.sh "$IMAGE_NAME:$VERIFY_COMMIT" linux/arm64
