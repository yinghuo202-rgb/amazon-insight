name: measureman-commerce-os

services:
  reverse-proxy:
    image: "${PROXY_IMAGE:-nginx:1.27.5-alpine}"
    pull_policy: "${IMAGE_PULL_POLICY:-missing}"
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3001}:8080"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true

  web:
    image: "${WEB_IMAGE:-measureman-commerce-web:1.0.0}"
    pull_policy: "${IMAGE_PULL_POLICY:-missing}"
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_APP_URL: "${PUBLIC_APP_URL:-http://localhost:3001}"
      DATABASE_URL: file:/data/app/selection.db
      AUTH_SESSION_TTL_DAYS: "${AUTH_SESSION_TTL_DAYS:-14}"
      AUTH_SECURE_COOKIE: "${AUTH_SECURE_COOKIE:-false}"
      STORE_OPS_AUTOMATION_ROOT: /opt/store-ops
      STORE_OPS_DATA_ROOT: /data/sources
      STORE_OPS_RUNTIME_ROOT: /data/runtime
      STORE_OPS_STATE_DB: /data/runtime/db/operations.sqlite3
      STORE_OPS_PYTHON: /opt/store-ops-venv/bin/python
      JS_USE_MOCK: "${JS_USE_MOCK:-false}"
      JS_API_KEY_NAME: "${JS_API_KEY_NAME:-}"
      JS_API_KEY: "${JS_API_KEY:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-disabled}"
      LLM_API_BASE_URL: "${LLM_API_BASE_URL:-https://api.openai.com/v1}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
    volumes:
      - "${APP_DATA_PATH:-/volume1/docker/measureman-commerce/data/app}:/data/app"
      - "${RUNTIME_DATA_PATH:-/volume1/docker/measureman-commerce/data/runtime}:/data/runtime"
      - "${SOURCE_DATA_PATH:-/volume1/measureman}:/data/sources:ro"
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks:
      - frontend
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/inventory').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 45s
    security_opt:
      - no-new-privileges:true

networks:
  frontend:
    driver: bridge
